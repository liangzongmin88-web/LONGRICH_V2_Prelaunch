name: Optimize NT011-US from GSC query signal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nt011-gsc-ctr-optimize.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align NT011-US title and snippet with GSC signal
        shell: python
        run: |
          from pathlib import Path

          p = Path('nt011-us.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
            '<title>70W GaN Travel Adapter Manufacturer | NT011-US OEM | LONGRICH</title>':
              '<title>NT011-US 70W GaN Travel Adapter | OEM Manufacturer | LONGRICH</title>',
            '<meta content="NT011-US 70W GaN universal travel adapter for OEM/ODM projects with 3 USB-C, 1 USB-A, global plug system and factory engineering support." name="description"/>':
              '<meta content="NT011-US 70W GaN universal travel adapter for OEM/ODM projects. 3 USB-C + 1 USB-A, global plug system, 10A AC rating and factory engineering support." name="description"/>',
            '<meta content="70W GaN Travel Adapter Manufacturer | NT011-US OEM | LONGRICH" property="og:title"/>':
              '<meta content="NT011-US 70W GaN Travel Adapter | OEM Manufacturer | LONGRICH" property="og:title"/>',
            '<meta content="NT011-US 70W GaN universal travel adapter for OEM/ODM projects with 3 USB-C, 1 USB-A, global plug system and factory engineering support." property="og:description"/>':
              '<meta content="NT011-US 70W GaN universal travel adapter for OEM/ODM projects with 3 USB-C + 1 USB-A, global plug system and factory engineering support." property="og:description"/>',
            '"name":"70W GaN Travel Adapter Manufacturer | NT011-US OEM | LONGRICH"':
              '"name":"NT011-US 70W GaN Travel Adapter | OEM Manufacturer | LONGRICH"',
            '"description":"NT011-US 70W GaN universal travel adapter for OEM/ODM projects with 3 USB-C, 1 USB-A, global plug system and factory engineering support."':
              '"description":"NT011-US 70W GaN universal travel adapter for OEM/ODM projects with 3 USB-C + 1 USB-A, global plug system and factory engineering support."'
          }

          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          # Add an exact-model relevance sentence without changing product specs.
          needle = '<p>NT011-US is LONGRICH’s 70W GaN universal travel adapter platform for premium travel charging programs.'
          if needle in s and 'Searches for NT011' not in s:
              s = s.replace(
                  needle,
                  '<p><strong>NT011 / NT011-US</strong> refers to LONGRICH’s 70W GaN universal travel adapter platform for OEM and ODM projects. '
                  'NT011-US is LONGRICH’s 70W GaN universal travel adapter platform for premium travel charging programs.'
              )
              changed = True

          if not changed:
              raise SystemExit('No NT011-US changes were applied')

          p.write_text(s, encoding='utf-8')

      - name: Commit NT011-US search optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nt011-us.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Optimize NT011-US title and snippet from GSC query signal"
          git push origin HEAD:main
