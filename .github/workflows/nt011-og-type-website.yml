name: Set NT011-US Open Graph type to website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nt011-og-type-website.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update og:type
        shell: python
        run: |
          from pathlib import Path
          path = Path('nt011-us.html')
          s = path.read_text(encoding='utf-8')
          old = '<meta content="product" property="og:type"/>'
          new = '<meta content="website" property="og:type"/>'
          if old not in s:
              raise SystemExit('Expected og:type=product tag not found')
          path.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nt011-us.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Set NT011-US og:type to website"
          git push origin HEAD:main
