name: Optimize web images

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/optimize-web-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Generate WebP product assets
        shell: bash
        run: |
          set -euo pipefail
          find assets/images/products -type f -name '*-transparent.png' -print0 | while IFS= read -r -d '' src; do
            dst="${src%.png}.webp"
            cwebp -quiet -q 88 -m 6 -alpha_q 100 "$src" -o "$dst"
          done

      - name: Optimize HTML loading and accessibility structure
        shell: python
        run: |
          from pathlib import Path
          import re

          def optimize_img_tag(match):
              tag = match.group(0)
              if 'heroProduct nt011' in tag:
                  tag = re.sub(r'\sloading="(?:lazy|eager)"', '', tag)
                  tag = re.sub(r'\sfetchpriority="(?:low|high|auto)"', '', tag)
                  return tag.replace('<img', '<img loading="eager" fetchpriority="high"', 1)
              if 'loading=' not in tag:
                  tag = tag.replace('<img', '<img loading="lazy"', 1)
              if 'decoding=' not in tag:
                  tag = tag.replace('<img', '<img decoding="async"', 1)
              if 'fetchpriority=' not in tag:
                  tag = tag.replace('<img', '<img fetchpriority="low"', 1)
              return tag

          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('-transparent.png', '-transparent.webp')
              # Footer section titles previously used H4 after H2/H3 content, which
              # triggered Lighthouse heading-order warnings. H3 preserves styling intent
              # while keeping a sequential document outline.
              s2 = re.sub(r'<h4(\b[^>]*)>', r'<h3\1>', s2, flags=re.I)
              s2 = re.sub(r'</h4>', '</h3>', s2, flags=re.I)
              if p.name == 'index.html':
                  preload = '<link rel="preload" as="image" href="assets/images/products/NT011-US-transparent.webp" fetchpriority="high"/>\n'
                  if preload not in s2:
                      s2 = s2.replace('<link href="https://www.longrichpower.com/" rel="canonical"/>', preload + '<link href="https://www.longrichpower.com/" rel="canonical"/>')
              s2 = re.sub(r'<img\b[^>]*>', optimize_img_tag, s2, flags=re.I)
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')

          js = Path('assets/site-enhancements.js')
          s = js.read_text(encoding='utf-8')
          old = """  if ('requestIdleCallback' in window) {\n    window.requestIdleCallback(loadAnalytics, { timeout: 3000 });\n  } else {\n    window.setTimeout(loadAnalytics, 2500);\n  }"""
          new = """  window.addEventListener('load', () => {\n    window.setTimeout(loadAnalytics, 10000);\n  }, { once: true });"""
          s = s.replace(old, new)
          old_resize = """    window.addEventListener('resize', () => {\n      if (window.innerWidth > 980) closeMenu();\n    });"""
          new_resize = """    const desktopQuery = window.matchMedia('(min-width: 981px)');\n    desktopQuery.addEventListener('change', event => {\n      if (event.matches) closeMenu();\n    });"""
          s = s.replace(old_resize, new_resize)
          js.write_text(s, encoding='utf-8')

      - name: Commit performance and accessibility optimizations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/products/*.webp assets/site-enhancements.js *.html
          if git diff --cached --quiet; then
            echo "No optimization changes to commit"
            exit 0
          fi
          git commit -m "Normalize headings and optimize delivery"
          git push origin HEAD:main
