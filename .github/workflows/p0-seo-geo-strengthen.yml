name: Strengthen P0 SEO GEO pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/p0-seo-geo-strengthen.yml'
      - 'SEO_GEO_ACQUISITION_MATRIX.md'

permissions:
  contents: write

jobs:
  strengthen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Strengthen five P0 acquisition pages
        shell: python
        run: |
          from pathlib import Path
          from bs4 import BeautifulSoup

          pages = {
            'travel-adapter-manufacturer.html': {
              'title': 'Travel Adapter Manufacturer & OEM Factory | LONGRICH',
              'description': 'Factory-direct travel adapter manufacturer for OEM and ODM projects. LONGRICH supports universal, GaN and country-specific adapters with engineering, testing and mass production.',
              'h1': 'Travel Adapter Manufacturer for OEM & ODM Projects.',
              'summary': 'LONGRICH is a factory-direct travel adapter manufacturer for brands, distributors, retailers and e-commerce sellers. Current product directions include universal, GaN and country-specific travel adapters for US, UK, EU and Australian markets.',
              'facts': ['6 production lines', '4,000,000+ units annual capacity', 'OEM and ODM development', 'Engineering, testing and mass-production support'],
              'links': [('View Universal Platforms','universal-travel-adapters.html'),('See Quality & Testing','quality-testing.html'),('Start an OEM Project','request-a-quote.html')]
            },
            'oem-odm-travel-adapter.html': {
              'title': 'OEM Travel Adapter Manufacturer & ODM Development | LONGRICH',
              'description': 'OEM and ODM travel adapter development from existing-platform customization to industrial design, tooling, USB-C integration, validation and mass production.',
              'h1': 'OEM & ODM Travel Adapter Development for Global Brands.',
              'summary': 'LONGRICH supports two project paths: OEM customization of an existing travel adapter platform, or ODM development when a brand needs differentiated architecture, plug layout, charging power, tooling or industrial design.',
              'facts': ['Existing-platform OEM customization', 'New ODM architecture and tooling', '20W, 45W and 70W platform directions', 'Support for US, UK, EU and AU project requirements'],
              'links': [('Compare Platforms','universal-travel-adapters.html'),('Review Manufacturing','manufacturing.html'),('Send Project Requirements','request-a-quote.html')]
            },
            'universal-travel-adapters.html': {
              'title': 'Universal Travel Adapter Supplier | 20W 45W 70W OEM | LONGRICH',
              'description': 'Universal travel adapter supplier and OEM/ODM manufacturer with 20W, 45W and 70W platforms, USB-C charging, global plug systems and engineering support.',
              'h1': 'Universal Travel Adapter Supplier for 20W, 45W & 70W OEM Programs.',
              'summary': 'LONGRICH universal travel adapter platforms cover compact 20W, mainstream 45W and premium 70W charging directions. Buyers can start from an existing platform for faster OEM execution or use a platform as the basis for ODM development.',
              'facts': ['20W, 45W and 70W product classes', 'USB-C charging platforms', 'US, UK, EU and AU market configurations', 'OEM/ODM and private-label project support'],
              'links': [('20W vs 45W vs 70W Guide','20w-vs-45w-vs-70w-travel-adapter.html'),('View NT011-US 70W','nt011-us.html'),('Request OEM Quote','request-a-quote.html')]
            },
            'gan-travel-adapter.html': {
              'title': 'GaN Travel Adapter OEM Manufacturer | 45W & 70W | LONGRICH',
              'description': 'GaN travel adapter OEM and ODM manufacturing for 45W and 70W USB-C platforms. Explore power density, thermal design, compact architecture and test evidence.',
              'h1': 'GaN Travel Adapter OEM Platforms for 45W and 70W USB-C.',
              'summary': 'GaN is useful when a travel adapter needs higher USB-C power density without excessive product volume. LONGRICH applies GaN platform development to 45W and 70W travel adapter directions while retaining thermal, safety and mechanical validation requirements.',
              'facts': ['45W and 70W GaN platform directions', 'USB-C PD integration', 'Compact architecture and thermal design', '70W full-load engineering test available'],
              'links': [('View NT011-US 70W','nt011-us.html'),('See 70W Full-Load Test','70w-gan-travel-adapter-full-load-test.html'),('Discuss GaN ODM','request-a-quote.html')]
            },
            'nt011-us.html': {
              'title': '70W GaN Travel Adapter Manufacturer | NT011-US OEM | LONGRICH',
              'description': 'NT011-US 70W GaN universal travel adapter for OEM/ODM projects with 3 USB-C, 1 USB-A, global plug system and factory engineering support.',
              'h1': 'NT011-US 70W GaN Universal Travel Adapter for OEM Projects.',
              'summary': 'NT011-US is LONGRICH’s 70W GaN universal travel adapter platform for premium travel charging programs. It combines a global plug system with 3 USB-C and 1 USB-A ports and is positioned for laptop and multi-device use cases.',
              'facts': ['70W USB-C maximum output', '3 USB-C + 1 USB-A', '100–250V~, 10A Max, 2500W Max AC rating', 'OEM/ODM factory support'],
              'links': [('View 70W Full-Load Test','70w-gan-travel-adapter-full-load-test.html'),('Compare 20W / 45W / 70W','20w-vs-45w-vs-70w-travel-adapter.html'),('Request NT011-US Quote','request-a-quote.html?model=NT011-US')]
            }
          }

          style = '''
          .p0Facts{padding:34px 0;background:#fff;border-top:1px solid #e5eaf0;border-bottom:1px solid #e5eaf0}
          .p0Facts .p0Box{width:min(1120px,calc(100% - 40px));margin:auto;display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:start}
          .p0Facts h2{font-size:28px;letter-spacing:-.8px;margin:0 0 10px;color:#0f172a}
          .p0Facts p{margin:0;color:#475569;font-size:16px;line-height:1.65}
          .p0Facts ul{margin:0;padding-left:20px;color:#334155}
          .p0Facts li{margin:6px 0}
          .p0Actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
          .p0Actions a{display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border:1px solid #0f172a;border-radius:10px;color:#0f172a;text-decoration:none;font-weight:800;font-size:13px;background:#fff}
          .p0Actions a:last-child{background:#0b63f6;border-color:#0b63f6;color:#fff}
          @media(max-width:760px){.p0Facts .p0Box{grid-template-columns:1fr}.p0Facts{padding:28px 0}}
          '''

          for filename, cfg in pages.items():
              path = Path(filename)
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')

              if soup.title:
                  soup.title.string = cfg['title']
              meta = soup.find('meta', attrs={'name':'description'})
              if meta:
                  meta['content'] = cfg['description']
              ogt = soup.find('meta', attrs={'property':'og:title'})
              if ogt:
                  ogt['content'] = cfg['title']
              ogd = soup.find('meta', attrs={'property':'og:description'})
              if ogd:
                  ogd['content'] = cfg['description']

              h1 = soup.find('h1')
              if h1:
                  h1.string = cfg['h1']

              old = soup.find('section', class_='p0Facts')
              if old:
                  old.decompose()
              old_style = soup.find('style', id='p0-acquisition-style')
              if old_style:
                  old_style.decompose()
              style_tag = soup.new_tag('style', id='p0-acquisition-style')
              style_tag.string = style
              soup.head.append(style_tag)

              section = soup.new_tag('section', **{'class':'p0Facts', 'aria-label':'Buyer summary'})
              box = soup.new_tag('div', **{'class':'p0Box'})
              left = soup.new_tag('div')
              h2 = soup.new_tag('h2')
              h2.string = 'Buyer Summary'
              p = soup.new_tag('p')
              p.string = cfg['summary']
              actions = soup.new_tag('div', **{'class':'p0Actions'})
              for label, href in cfg['links']:
                  a = soup.new_tag('a', href=href)
                  a.string = label
                  actions.append(a)
              left.extend([h2,p,actions])
              right = soup.new_tag('div')
              ul = soup.new_tag('ul')
              for fact in cfg['facts']:
                  li = soup.new_tag('li')
                  li.string = fact
                  ul.append(li)
              right.append(ul)
              box.extend([left,right])
              section.append(box)

              hero = soup.find('section', class_='hero')
              if hero:
                  hero.insert_after(section)
              else:
                  body = soup.body
                  body.insert(0, section)

              path.write_text(str(soup), encoding='utf-8')

      - name: Commit P0 page strengthening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel-adapter-manufacturer.html oem-odm-travel-adapter.html universal-travel-adapters.html gan-travel-adapter.html nt011-us.html
          if git diff --cached --quiet; then
            echo "No P0 changes to commit"
            exit 0
          fi
          git commit -m "Strengthen P0 SEO GEO acquisition pages"
          git push origin HEAD:main
