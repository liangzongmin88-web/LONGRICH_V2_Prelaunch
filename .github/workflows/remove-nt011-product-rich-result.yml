name: Remove NT011-US product rich-result markup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-nt011-product-rich-result.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Product JSON-LD with B2B WebPage JSON-LD
        shell: python
        run: |
          from pathlib import Path
          import re, json

          path = Path('nt011-us.html')
          s = path.read_text(encoding='utf-8')

          replacement = {
            "@context": "https://schema.org",
            "@graph": [
              {
                "@type": "Organization",
                "@id": "https://www.longrichpower.com/#organization",
                "name": "LONGRICH Power Solutions",
                "url": "https://www.longrichpower.com/"
              },
              {
                "@type": "WebPage",
                "@id": "https://www.longrichpower.com/nt011-us.html#webpage",
                "url": "https://www.longrichpower.com/nt011-us.html",
                "name": "70W GaN Travel Adapter Manufacturer | NT011-US OEM | LONGRICH",
                "description": "NT011-US 70W GaN universal travel adapter for OEM/ODM projects with 3 USB-C, 1 USB-A, global plug system and factory engineering support.",
                "about": {
                  "@type": "Thing",
                  "name": "NT011-US 70W GaN Universal Travel Adapter"
                },
                "publisher": {"@id": "https://www.longrichpower.com/#organization"},
                "breadcrumb": {"@id": "https://www.longrichpower.com/nt011-us.html#breadcrumb"}
              },
              {
                "@type": "BreadcrumbList",
                "@id": "https://www.longrichpower.com/nt011-us.html#breadcrumb",
                "itemListElement": [
                  {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.longrichpower.com/"},
                  {"@type": "ListItem", "position": 2, "name": "Universal Travel Adapters", "item": "https://www.longrichpower.com/universal-travel-adapters.html"},
                  {"@type": "ListItem", "position": 3, "name": "NT011-US", "item": "https://www.longrichpower.com/nt011-us.html"}
                ]
              }
            ]
          }
          new_json = json.dumps(replacement, ensure_ascii=False, separators=(',', ':'))

          pattern = re.compile(r'<script type="application/ld\+json">(?:(?!</script>).)*"@type":"Product"(?:(?!</script>).)*</script>', re.S)
          if not pattern.search(s):
            raise SystemExit('Product JSON-LD block not found')
          s = pattern.sub('<script type="application/ld+json">' + new_json + '</script>', s, count=1)
          path.write_text(s, encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nt011-us.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Remove invalid NT011-US product rich-result markup"
          git push origin HEAD:main
