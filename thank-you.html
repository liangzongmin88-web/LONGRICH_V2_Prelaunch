</head><body><main class="confirmation"><section class="card"><div class="mark" aria-hidden="true">✓</div><h1>Thank you. Your request is in.</h1><p>Our sales team will review the product, market and project details you submitted.</p><p>Your reference:</p><div class="reference" id="lead-reference">Pending</div></section></main>
